<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embedding run</title>
<style>
  :root { color-scheme: dark; --bg:#111418; --card:#1a1f26; --line:#2a313b; --fg:#e6e9ee; --dim:#8b95a3; --ok:#4cc38a; --warn:#e5b454; --bad:#e5655b; --bar:#4a90e2; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:820px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .big { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .row > div { flex:1 1 150px; }
  .label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .num { font-variant-numeric:tabular-nums; }
  .track { height:12px; background:#0d1014; border-radius:6px; overflow:hidden; margin:8px 0 4px; }
  .fill { height:100%; background:var(--bar); transition:width .6s; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; font-size:12px; text-transform:uppercase; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .log { font:13px/1.5 ui-monospace, monospace; color:var(--dim); white-space:pre-wrap; }
  svg { width:100%; height:120px; display:block; }
  .state-finished { color:var(--ok); } .state-stopped, .stale { color:var(--warn); }
</style>
<main>
  <h1>Wikipedia embedding run <span id="state"></span></h1>
  <div class="sub" id="sub">connecting…</div>

  <div class="card">
    <div class="row">
      <div><div class="label">Overall</div><div class="big" id="pct">–</div></div>
      <div><div class="label">Speed</div><div class="big" id="rate">–</div></div>
      <div><div class="label">Finishes</div><div class="big" id="eta">–</div></div>
    </div>
    <div class="track"><div class="fill" id="bar" style="width:0"></div></div>
    <div class="num" id="counts" style="color:var(--dim);font-size:13px"></div>
  </div>

  <div class="card">
    <div class="label">Current part <span id="part"></span></div>
    <div class="track"><div class="fill" id="pbar" style="width:0"></div></div>
    <div class="num" id="pcounts" style="color:var(--dim);font-size:13px"></div>
  </div>

  <div class="card">
    <table><thead><tr><th>GPU</th><th>Speed</th><th>Embedded</th><th>Share</th><th>Status</th></tr></thead><tbody id="gpus"></tbody></table>
  </div>

  <div class="card">
    <div class="label">Articles per second, per minute</div>
    <svg id="chart" viewBox="0 0 800 120" preserveAspectRatio="none" role="img" aria-label="speed over time"></svg>
  </div>

  <div class="card"><div class="label">Recent events</div><div class="log" id="log"></div></div>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString();
const hm = t => new Date(t * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function chart(h) {
  const svg = $('chart');
  if (h.length < 2) { svg.innerHTML = '<text x="10" y="60" fill="#8b95a3" font-size="14">collecting (one point a minute)…</text>'; return; }
  const max = Math.max(...h.map(p => p[1])) * 1.1 || 1, t0 = h[0][0], t1 = h[h.length - 1][0];
  const pts = h.map(p => `${(p[0] - t0) / (t1 - t0 || 1) * 800},${120 - p[1] / max * 110}`).join(' ');
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="#4a90e2" stroke-width="2" vector-effect="non-scaling-stroke"/>` +
    `<text x="4" y="14" fill="#8b95a3" font-size="12">${Math.round(max / 1.1)}/s</text>`;
}

async function tick() {
  try {
    const d = await (await fetch('status.json', {cache: 'no-store'})).json();
    const pct = d.done / Math.max(1, d.total);
    $('state').textContent = d.state === 'running' ? '' : `– ${d.state}`;
    $('state').className = 'state-' + d.state;
    $('sub').textContent = `started ${hm(d.started)}, running ${((d.now - d.started) / 3600).toFixed(1)} h · updated ${hm(d.now)}`;
    $('sub').className = 'sub';
    $('pct').textContent = (100 * pct).toFixed(1) + '%';
    $('rate').textContent = Math.round(d.rate) + '/s';
    $('eta').textContent = d.state === 'finished' ? 'done' : d.eta_h ? hm(d.now + d.eta_h * 3600) : '–';
    $('bar').style.width = (100 * pct) + '%';
    $('counts').textContent = `${fmt(d.done)} of ~${fmt(d.total)} articles` + (d.eta_h ? ` · ${d.eta_h.toFixed(1)} h left` : '');
    $('part').textContent = d.part;
    $('pbar').style.width = (100 * d.part_done / Math.max(1, d.part_total)) + '%';
    $('pcounts').textContent = `${fmt(d.part_done)} / ${fmt(d.part_total)}`;
    const all = d.servers.reduce((a, s) => a + s.done, 0) || 1;
    $('gpus').innerHTML = d.servers.map(s => {
      const ok = s.status === 'ok';
      return `<tr><td><span class="dot" style="background:${ok ? 'var(--ok)' : 'var(--bad)'}"></span>${esc(s.name)}</td>` +
        `<td>${s.rate.toFixed(1)}/s</td><td>${fmt(s.done)}</td><td>${Math.round(100 * s.done / all)}%</td><td>${esc(s.status)}</td></tr>`;
    }).join('');
    chart(d.history);
    $('log').textContent = d.log.slice().reverse().join('\n');
  } catch (e) {
    $('sub').textContent = 'not reachable – the run may have stopped or the machine is busy';
    $('sub').className = 'sub stale';
  }
}
tick(); setInterval(tick, 3000);
</script>
</html>
